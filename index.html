<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PoS 職業解鎖</title>
    <link rel="stylesheet" href="site.css">
  </head>
  <body>
    <main>
      <h1>Plane of Sky 職業解鎖</h1>
      <p class="local">這兩個檔只在這台瀏覽器裡讀，不會送出。上次選的檔會留在這台瀏覽器，再上傳同一欄會換成新的。</p>
      <p>成就檔：遊戲裡打 <code>/outputfile achievements</code>，不要加 Complete。安裝目錄會出現 <code>*-Achievements.txt</code>。</p>
      <p>裝備檔：<code>/outputfile inventory</code>，也就是 <code>/output inventory</code>。安裝目錄會出現 <code>*-Inventory.txt</code>。銀行和 KeyRing 都算持有。身上有這筆試煉的成品，這筆就算解過。材料不會因為銀行裡有成品就變成已有。成品刪掉之後，要靠成就檔才知道。</p>
      <p><span class="eq-item">道具</span>　<span class="eq-gear">裝備</span>　<span class="eq-mob">怪物</span></p>
      <label>成就清單 <input id="ach" type="file" accept=".txt"></label>
      <p id="ach-name"></p>
      <label>裝備清單 <input id="inv" type="file" accept=".txt"></label>
      <p id="inv-name"></p>
      <div id="banners"></div>
      <p id="completed"></p>
      <div id="tabs" hidden>
        <button type="button" id="tab-class" aria-selected="true">依職業</button>
        <button type="button" id="tab-island">依島</button>
      </div>
      <div id="class-pane"></div>
      <div id="island-pane" hidden></div>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
